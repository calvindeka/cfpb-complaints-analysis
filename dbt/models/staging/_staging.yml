version: 2

models:
  - name: stg_complaints
    description: Typed and flagged complaints, one row per complaint_id.
    columns:
      - name: complaint_id
        data_tests: [unique, not_null]
      - name: date_received
        data_tests: [not_null]
      - name: product
        data_tests:
          - accepted_values:
              arguments:
                values: ['Mortgage', 'Credit card', 'Checking or savings account']
      - name: submitted_via
        data_tests:
          - accepted_values:
              arguments:
                values: ['Web', 'Referral', 'Phone', 'Postal mail']
      - name: days_to_company
        description: Days from CFPB receipt to forwarding; never negative.
