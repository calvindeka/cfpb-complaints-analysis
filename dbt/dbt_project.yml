# dbt layer for the CFPB analysis: turns the raw SQLite table into tested,
# documented models (staging -> fact/dimension -> marts) that Tableau reads.
name: cfpb
version: "1.0.0"
config-version: 2
profile: cfpb

model-paths: ["models"]
test-paths: ["tests"]
target-path: target
clean-targets: ["target", "dbt_packages", "logs"]

models:
  cfpb:
    staging:
      +materialized: view    # cheap, always reflects the source
    marts:
      +materialized: table   # what Tableau and the semantic model read
